name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed by the release job; harmless elsewhere

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libwayland-dev libvulkan1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Stage artifact
        run: |
          mkdir -p dist/murmuration
          cp target/release/murmuration dist/murmuration/
          cp -r shaders dist/murmuration/
          cp README.md BUILDING.md LICENSE dist/murmuration/

      - uses: actions/upload-artifact@v4
        with:
          name: murmuration-linux-x86_64
          path: dist/murmuration

      - name: Package release tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -C dist -czf murmuration-linux-x86_64.tar.gz murmuration

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: murmuration-linux-x86_64.tar.gz
          generate_release_notes: true
